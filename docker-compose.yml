services:

  # =========================================================
  # ZooKeeper
  # =========================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper

    environment:
      # Порт ZooKeeper для подключения Kafka-брокеров
      ZOOKEEPER_CLIENT_PORT: 2181

      # Интервал heartbeat ZooKeeper
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z localhost 2181 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped


  # =========================================================
  # Kafka Broker 1
  # =========================================================

  kafka-broker-1:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker-1

    depends_on:
      zookeeper:
        condition: service_healthy

    environment:
      # Уникальный ID брокера
      KAFKA_BROKER_ID: 1

      # Адрес ZooKeeper
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # INTERNAL используется внутри Docker-сети
      # EXTERNAL используется с хостовой машины
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Kafka слушает два интерфейса
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      # Адреса, возвращаемые Kafka клиентам
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092,EXTERNAL://localhost:9092

      # Межброкерное взаимодействие
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Репликация служебного offsets topic
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      # Минимальное количество синхронизированных реплик
      KAFKA_MIN_INSYNC_REPLICAS: 2

      # Пользовательские топики создаются kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "9092:9092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped


  # =========================================================
  # Kafka Broker 2
  # =========================================================

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker-2

    depends_on:
      zookeeper:
        condition: service_healthy

    environment:
      KAFKA_BROKER_ID: 2

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:29092,EXTERNAL://localhost:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "9093:9092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped


  # =========================================================
  # Kafka Broker 3
  # =========================================================

  kafka-broker-3:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-broker-3

    depends_on:
      zookeeper:
        condition: service_healthy

    environment:
      KAFKA_BROKER_ID: 3

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:29092,EXTERNAL://localhost:9094

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    ports:
      - "9094:9092"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped


  # =========================================================
  # Инициализация Kafka
  #
  # Контейнер ждёт готовности всех трёх брокеров,
  # создаёт необходимые топики и завершается с code 0.
  # =========================================================

  kafka-init:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-init

    depends_on:
      kafka-broker-1:
        condition: service_healthy

      kafka-broker-2:
        condition: service_healthy

      kafka-broker-3:
        condition: service_healthy

    command:
      - /bin/bash
      - -c
      - |
        echo "========================================"
        echo "Создание Kafka-топиков"
        echo "========================================"

        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic messages \
          --partitions 1 \
          --replication-factor 2

        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic filtered_messages \
          --partitions 1 \
          --replication-factor 2

        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic blocked_users \
          --partitions 1 \
          --replication-factor 2

        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --create \
          --if-not-exists \
          --topic banned_words \
          --partitions 1 \
          --replication-factor 2

        echo ""
        echo "========================================"
        echo "Созданные Kafka-топики"
        echo "========================================"

        kafka-topics \
          --bootstrap-server kafka-broker-1:29092 \
          --list

        echo ""
        echo "Kafka-топики успешно созданы"

    restart: "no"


  # =========================================================
  # Kafka UI
  # =========================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: kafka-ui

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: message-moderation-cluster

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092

    restart: unless-stopped


  # =========================================================
  # Faust Stream Processing
  # =========================================================

  faust:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: faust-moderation

    environment:
      APP_NAME: message-moderation

      # Faust подключается к Kafka через INTERNAL listener
      KAFKA_BROKER: kafka://kafka-broker-1:29092

      LOG_LEVEL: INFO

    depends_on:
      kafka-init:
        condition: service_completed_successfully

    volumes:
      # Persistent state Faust / RocksDB
      - faust_data:/root/.local/share/faust

    restart: unless-stopped


# =========================================================
# Docker volumes
# =========================================================

volumes:

  faust_data: